apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-affinity
  namespace: roboshop
  label:
    name: roboshop
    env: development
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roboshop
      env: development
  template:
    metadata:
      label:
        name: roboshop
        env: development
    spec:
      containers:
      - name: nginx
        image: nginx
      affinity:
        nodeAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            